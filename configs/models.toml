# The VLMs that analyse the footage. All run on device, one at a time, on one
# RTX 5090 (32 GB). Chosen 2026-10-25: four developers and model lineages, so a
# finding shared by several models is not one family's bias.
#
# Fitting 32 GB: a ~27-31B model in BF16 needs ~55-62 GB, so those run as 4-bit
# (W4A16) checkpoints; 8B models run in BF16. Every model keeps roughly 10 GB or
# more for the vision encoder, image tokens and KV cache.
#
# Serving: vLLM (Linux or WSL2, CUDA 12.8+ build for Blackwell) with its
# OpenAI-compatible API on localhost, so one client talks to every model.
# Each model is pinned to the commit downloaded on 2026-10-25 (`revision`).

[server]
port = 8000
# vLLM refuses to start unless this fraction of the card is free. The KV cache is fixed
# (kv_cache_gib), so this is only that start-up check: 0.72 failed on 2026-10-26 when the
# CROWD workers held 12 GB; 0.60 (19.1 GB) still leaves room for the largest model's weights.
gpu_memory_utilization = 0.60
# Requests sent at once by scripts/audit/run_vlm.py (each server allows --max-num-seqs 4).
parallel_requests = 4
max_model_len = 16384
max_images = 10
# wsl5090 has no CUDA toolkit (nvcc), so FlashInfer cannot compile its kernels there;
# Triton attention needs only a C compiler (serve/cc). Same backend for every model.
# --enforce-eager: no torch.compile or CUDA graphs. Capturing graphs took ~19 min per graph
# under WSL with the CROWD workers on the same GPU; eager is slower per answer but starts fast.
# A fixed KV cache (kv_cache_gib) instead of one inferred from gpu_memory_utilization: vLLM
# infers it from the change in free GPU memory during a test run, and on this shared GPU the
# CROWD workers' memory moves meanwhile, so every 8B model came out "negative" (2026-10-25).
# Requests are sent one at a time and stay under 8k tokens, so a few GiB is plenty.
# None of these settings change the answers.
# No whitespace between JSON tokens: with the longer MAPS schema, Qwen and Gemma filled their
# whole answer budget with spaces after a field in 7 of 12 smoke-test answers (2026-10-28).
# The first two runs (open, checklist) were made without it.
vllm_args = ["--attention-backend", "TRITON_ATTN", "--enforce-eager", "--max-num-seqs", "4",
             "--max-num-batched-tokens", "8192",
             "--structured-outputs-config", '{"backend": "xgrammar", "disable_any_whitespace": true}']
kv_cache_gib = 3
env = { VLLM_USE_FLASHINFER_SAMPLER = "0" }

[[model]]
key = "qwen3.8-27b"
family = "Qwen (Alibaba)"
checkpoint = "RedHatAI/Qwen3.8-27B-INT4"   # W4A16 of Qwen/Qwen3.8-27B (Aug 2026)
revision = "91bd022d5b49442a868bc35008f6c21e1860edfa"   # downloaded 2026-10-25
base = "Qwen/Qwen3.8-27B"
precision = "int4-w4a16"
approx_weights_gb = 17
license = "apache-2.0"
role = "strongest general model; image + video; Qwen grounding format"
notes = "Thinking is on by default: set enable_thinking=false for structured JSON output, or log the reasoning separately."

[[model]]
key = "gemma4-31b"
family = "Gemma (Google)"
checkpoint = "google/gemma-4-31B-it-qat-w4a16-ct"   # Google's own quantisation-aware 4-bit
revision = "52f3f65bc7a02d555763bc923bd1d9094898219d"   # downloaded 2026-10-25
base = "google/gemma-4-31B-it"
precision = "int4-w4a16 (QAT)"
approx_weights_gb = 19
license = "apache-2.0"
role = "second large model from another lineage; object detection and pointing listed on its card"
notes = "Video only as frames, at most 60 s at 1 fps. Set the visual token budget (70-1120) explicitly and keep it the same across runs."
# The largest model (19.8 GB of weights) with a large KV per token (8k context = 6.9 GiB).
# Its prompts are ~2.2k tokens (about 280 per image) and checklist answers ~750, so a 4k
# context in a 3.5 GiB cache. With 4 GiB the card filled up next to the CROWD workers
# (30.9 of 32 GB) and generation fell from 13 to 2.6 tokens/s (2026-10-27).
max_model_len = 4096
kv_cache_gib = 3.5
max_answer_tokens = 1280   # prompt + answer must fit the 4k context (audit prompt ~2.6-2.7k; answers < 800)

[[model]]
key = "molmo2-8b"
family = "Molmo (Ai2)"
checkpoint = "allenai/Molmo2-8B"
revision = "e28fa28597e5ec5e0cca2201dd8ab33d48bc4a1b"   # downloaded 2026-10-25
base = "allenai/Molmo2-8B"
precision = "bf16"
approx_weights_gb = 18
license = "apache-2.0"
role = "localisation specialist: points and video tracks; open weights and open training data"
notes = "Outputs <points>/<tracks> with coordinates scaled to 0-1000, no boxes. Needs trust_remote_code."
trust_remote_code = true   # code reviewed at this revision 2026-10-25: network use only for video URLs, which are never sent

[[model]]
key = "internvl3.5-8b"
family = "InternVL (Shanghai AI Lab)"
checkpoint = "OpenGVLab/InternVL3_5-8B-HF"
revision = "741a7d03020411e666c6109218ab71e08151ef86"   # downloaded 2026-10-25
base = "OpenGVLab/InternVL3_5-8B"
precision = "bf16"
approx_weights_gb = 17
license = "apache-2.0"
role = "fourth lineage; older (Aug 2025), a reference point for how much newer models gain"
notes = "The -HF checkpoint loads with plain transformers, no remote code."

# Added 2026-11-07 (Shadab): a developer from Europe, so the set covers three countries of origin (US, China,
# France) for the cross-cultural comparison.

[[model]]
key = "ministral3-14b"
family = "Mistral (Mistral AI)"
checkpoint = "mistralai/Ministral-3-14B-Instruct-2512"   # Mistral's own FP8 release (Dec 2025)
revision = "29439f81c2be264d8d393273f99e7db9c0961120"   # downloaded 2026-11-07
base = "mistralai/Ministral-3-14B-Instruct-2512-BF16"
precision = "fp8 (official)"
approx_weights_gb = 16
license = "apache-2.0"
role = "European developer; dense 14B with a Pixtral-style vision encoder"
notes = "Mistral advises temperature below 0.1."
# Served as Mistral documents it: Mistral's own tokenizer, config and weights. Its tokenizer rejects any request
# with chat_template_kwargs (400 Bad Request, 2026-11-07), so they are left out for this model (it has no thinking
# mode). The Hugging Face tokenizer instead gave valid JSON that was nonsense (identical answers for different
# streets, point (1, 1), words like "nod_visibl_e"; 2026-11-08), so it is not used.
vllm_args = ["--tokenizer-mode", "mistral", "--config-format", "mistral", "--load-format", "mistral"]
thinking_switch = false

[[model]]
key = "exaone4.5-33b"
family = "EXAONE (LG AI Research)"
checkpoint = "LGAI-EXAONE/EXAONE-4.5-33B-AWQ"   # LG's own 4-bit release (Jul 2026)
revision = "31e6a965d0661bbe4a8b895e22a77f8271772ba0"   # downloaded 2026-11-07
base = "LGAI-EXAONE/EXAONE-4.5-33B"
precision = "int4-awq (official)"
approx_weights_gb = 23
license = "other (EXAONE AI Model License)"
role = "South Korean developer; the largest of the set"
notes = "Thinks by default: requests set enable_thinking=false, as for Qwen."
# The largest model: 23 GB of weights leave room for a small KV cache only, so 12k of context; fits only while the
# CROWD workers make way. 3 GiB held 12,272 tokens, just short of 12,288 (2026-11-09).
max_model_len = 12288
kv_cache_gib = 3.25
gpu_memory_utilization = 0.84
# vLLM's own EXAONE 4.5 code answered text correctly but returned nonsense for every image ("rural, 1 lane" for downtown
# Toronto, lines of "-"), with either vision attention backend (2026-11-09). Transformers' implementation instead.
vllm_args = ["--model-impl", "transformers"]

# Added 2026-11-09 (Shadab): developers from South Korea and Canada, for the cross-cultural comparison. Kanana runs
# beside another GPU job, on 0.27 of the card. HyperCLOVA X SEED Vision 3B (Naver) was the first Korean choice, but
# vLLM dropped its architecture after 0.28 and its config does not load in Transformers 5; Aya Vision (Cohere) runs
# through Transformers' implementation (below).

[[model]]
key = "kanana-1.5-v-3b"
family = "Kanana (Kakao)"
checkpoint = "kakaocorp/kanana-1.5-v-3b-instruct"
revision = "2e00ef13ccec2e99459a8eada18a1bfd05bff44b"   # downloaded 2026-11-09
base = "kakaocorp/kanana-1.5-v-3b-instruct"
precision = "bf16"
approx_weights_gb = 7.3
license = "other (Kanana License)"
role = "South Korean developer"
notes = "Needs timm in serve/ and the tokeniser built by serve/prepare_tokenizers.py."
trust_remote_code = true   # code reviewed at this revision 2026-11-09: no network, shell, file or pickle access
gpu_memory_utilization = 0.27
kv_cache_gib = 2.25   # 2 GiB held 16,368 tokens, just short of 16,384 (2026-11-09)
# Its repository loads a slow tokeniser that neither structured-output engine can read (xgrammar garbled the keys,
# guidance refused), and with Transformers 5 its fast class splits text into single characters. The fixed copy built
# by serve/prepare_tokenizers.py is loaded instead (relative to serve/, where vLLM starts).
vllm_args = ["--tokenizer", "../data/tokenizers/kanana-1.5-v-fast"]

[[model]]
key = "aya-vision-8b"
family = "Aya (Cohere)"
checkpoint = "CohereLabs/aya-vision-8b"   # gated: accept Cohere's terms, then `hf auth login` on the GPU machine
revision = "d7601ac8fd3baf6f59c5fc9514c618ef0f24268f"   # downloaded 2026-11-09
base = "CohereLabs/aya-vision-8b"
precision = "bf16"
approx_weights_gb = 17
license = "cc-by-nc-4.0"
role = "Canadian developer; multilingual (23 languages)"
# vLLM dropped its own Aya Vision code after 0.24; Transformers' implementation instead.
vllm_args = ["--model-impl", "transformers"]

# North-Micro-Vision (Cohere, Canada; CohereLabs/North-Micro-Vision-Instruct, revision fa548d9a) was run on
# 2026-11-09 and excluded (Shadab): it describes frames correctly, but in the audit all 588 listed needs sat at point
# (0, 0), 367 with the evidence "none", footways were only "none" or "physical_barrier" (even in downtown Toronto) and
# it found zebra crossings in JAAD at chance (balanced accuracy 0.57). Its answers are in logs/ on wsl5090, not outputs/.
