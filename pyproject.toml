[project]
name = "vlm-street-audit"
version = "1.0.0"
description = "Auditing pedestrian infrastructure in dashcam footage from 75 cities with on-device vision-language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "lpm-sampling>=0.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Not on PyPI; pinned to a tag so the draw stays reproducible (uv.lock records the commit).
lpm-sampling = { git = "https://github.com/M-Colley/lpm-sampling.git", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "kaleido>=1.5.0",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["paper", "serve/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # verbatim annotation XML

[tool.ruff.lint.isort]
known-first-party = ["vlm_street_audit"]
