[project]
name = "vlm-street-audit"
version = "0.1.0"
description = "VLM analysis of street footage for pedestrian problems and street improvements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lpm-sampling>=0.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Not on PyPI; pinned to a tag so the draw stays reproducible (uv.lock records the commit).
lpm-sampling = { git = "https://github.com/M-Colley/lpm-sampling.git", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
